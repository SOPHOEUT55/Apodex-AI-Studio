apiVersion: apps/v1
kind: Deployment
metadata:
  name: apodex-ai-chat
  labels:
    app: apodex-ai-chat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apodex-ai-chat
  template:
    metadata:
      labels:
        app: apodex-ai-chat
    spec:
      containers:
        - name: web
          image: gcr.io/PROJECT_ID/apodex-ai-chat:latest
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: apodex-ai-chat-service
spec:
  type: LoadBalancer
  selector:
    app: apodex-ai-chat
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
