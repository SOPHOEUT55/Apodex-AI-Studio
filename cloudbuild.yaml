# ==============================================================================
# Google Cloud Build Pipeline Configuration
# Builds container image and deploys to Google Cloud Run
# ==============================================================================
steps:
  # 1. Build the multi-stage Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/apodex-ai-chat:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/apodex-ai-chat:latest'
      - '.'

  # 2. Push the Docker image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/apodex-ai-chat:$COMMIT_SHA'

  # 3. Deploy to Google Cloud Run (Serverless container service)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'apodex-ai-chat'
      - '--image'
      - 'gcr.io/$PROJECT_ID/apodex-ai-chat:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/apodex-ai-chat:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/apodex-ai-chat:latest'

options:
  logging: CLOUD_LOGGING_ONLY
